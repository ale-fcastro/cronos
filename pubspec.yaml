name: cronos
description: Sistema operativo personal del tiempo.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.0
  sqflite: ^2.4.0
  # SQLite en escritorio (Linux/Windows) y en tests.
  sqflite_common_ffi: ^2.3.0
  # Empaqueta el binario nativo de SQLite para Linux/Windows/macOS, para no
  # depender de que el sistema tenga libsqlite3 instalada y sea localizable.
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  local_auth: ^2.3.0
  usage_stats: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: IBMPlexSans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-Bold.ttf
          weight: 700
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
